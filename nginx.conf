# Konfigurim nginx për SPA-në eTerminiAdminUi (prapa Cloudflare Tunnel).
server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    log_format  tunnel '$http_cf_connecting_ip - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log  /var/log/nginx/access.log tunnel;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml font/woff font/woff2;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires    off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Paneli i adminit nuk duhet indeksuar as futur në iframe.
    add_header X-Content-Type-Options "nosniff"  always;
    add_header X-Frame-Options        "DENY"     always;
    add_header X-Robots-Tag           "noindex, nofollow" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
